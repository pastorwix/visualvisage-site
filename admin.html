<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Visual Visage Blog</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Press+Start+2P&family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #fdf6e3 0%, #f8f9fa 100%);
      color: #2d2d2d;
      min-height: 100vh;
    }

    .admin-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem;
    }

    .admin-header {
      text-align: center;
      margin-bottom: 2rem;
      padding: 2rem 0;
    }

    .admin-header h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2rem;
      color: #333;
      margin-bottom: 0.5rem;
    }

    .admin-header p {
      color: #666;
      font-size: 1rem;
    }

    .login-section {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .login-section h2 {
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      color: #333;
      margin-bottom: 1rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 0.5rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 1rem;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      font-family: 'Quicksand', sans-serif;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #f2c94c;
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .btn {
      background: linear-gradient(135deg, #f2c94c 0%, #f39c12 100%);
      color: #333;
      padding: 1rem 2rem;
      border-radius: 10px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      border: none;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(242, 201, 76, 0.4);
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .admin-panel {
      display: none;
    }

    .admin-panel.active {
      display: block;
    }

    .post-form {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .post-form h2 {
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      color: #333;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .posts-list {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .posts-list h2 {
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      color: #333;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .post-item {
      border: 1px solid #e9ecef;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: white;
    }

    .post-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 0.5rem;
    }

    .post-meta {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 0.5rem;
    }

    .post-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .btn-small {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      width: auto;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-edit {
      background: #17a2b8;
      color: white;
    }

    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      text-align: center;
    }

    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      text-align: center;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 2rem;
    }

    @media (max-width: 480px) {
      .admin-container {
        padding: 0.5rem;
      }
      
      .post-actions {
        flex-direction: column;
      }
      
      .btn-small {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1>Visual Visage</h1>
      <p>Blog Admin Panel</p>
    </div>

    <!-- Login Section -->
    <div class="login-section" id="loginSection">
      <h2>Admin Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
      <!-- Create New Post -->
      <div class="post-form">
        <h2>Create New Post</h2>
        <form id="postForm">
          <div class="form-group">
            <label for="title">Post Title</label>
            <input type="text" id="title" required>
          </div>
          <div class="form-group">
            <label for="location">Location (optional)</label>
            <input type="text" id="location" placeholder="e.g., Creative Studio, Downtown">
          </div>
          <div class="form-group">
            <label for="content">Post Content</label>
            <textarea id="content" placeholder="Write your post content here..." required></textarea>
          </div>
          <div class="form-group">
            <label for="imageUrl">Image URL (optional)</label>
            <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">
          </div>
          <button type="submit" class="btn">Publish Post</button>
        </form>
      </div>

      <!-- Posts List -->
      <div class="posts-list">
        <h2>Manage Posts</h2>
        <div id="postsList">
          <div class="loading">Loading posts...</div>
        </div>
      </div>

      <!-- Logout -->
      <div style="text-align: center; margin-top: 2rem;">
        <button class="btn btn-secondary" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    let isAuthenticated = false;

    // Check if already logged in
    if (localStorage.getItem('adminToken')) {
      isAuthenticated = true;
      showAdminPanel();
      loadPosts();
    }

    // Login form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      
      try {
        const response = await fetch(`${API_BASE}/admin/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ password })
        });

        if (response.ok) {
          const data = await response.json();
          localStorage.setItem('adminToken', data.token);
          isAuthenticated = true;
          showAdminPanel();
          loadPosts();
          showMessage('Login successful!', 'success');
        } else {
          showMessage('Invalid password', 'error');
        }
      } catch (error) {
        showMessage('Login failed. Please try again.', 'error');
      }
    });

    // Create new post
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const title = document.getElementById('title').value;
      const location = document.getElementById('location').value;
      const content = document.getElementById('content').value;
      const imageUrl = document.getElementById('imageUrl').value;

      try {
        const response = await fetch(`${API_BASE}/posts`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('adminToken') || ''}`
          },
          body: JSON.stringify({
            title,
            location,
            content,
            imageUrl
          })
        });

        if (response.ok) {
          showMessage('Post published successfully!', 'success');
          document.getElementById('postForm').reset();
          loadPosts();
        } else {
          showMessage('Failed to publish post', 'error');
        }
      } catch (error) {
        showMessage('Failed to publish post. Please try again.', 'error');
      }
    });

    // Load posts
    async function loadPosts() {
      try {
        const response = await fetch(`${API_BASE}/posts`);
        const posts = await response.json();
        
        const postsList = document.getElementById('postsList');
        
        if (posts.length === 0) {
          postsList.innerHTML = '<div class="loading">No posts yet. Create your first post!</div>';
          return;
        }

        postsList.innerHTML = posts.map(post => `
          <div class="post-item">
            <div class="post-title">${post.title}</div>
            <div class="post-meta">
              ${new Date(post.date).toLocaleDateString()}
              ${post.location ? ` • 📍 ${post.location}` : ''}
              • ❤️ ${post.likes} likes
              • 💬 ${post.comments.length} comments
            </div>
            <div class="post-actions">
              <button class="btn btn-small btn-edit" onclick="editPost('${post.id}')">Edit</button>
              <button class="btn btn-small btn-danger" onclick="deletePost('${post.id}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('postsList').innerHTML = '<div class="error-message">Failed to load posts</div>';
      }
    }

    // Delete post
    async function deletePost(postId) {
      if (!confirm('Are you sure you want to delete this post?')) return;

      try {
        const response = await fetch(`${API_BASE}/posts/${postId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${localStorage.getItem('adminToken') || ''}`
          }
        });

        if (response.ok) {
          showMessage('Post deleted successfully!', 'success');
          loadPosts();
        } else {
          showMessage('Failed to delete post', 'error');
        }
      } catch (error) {
        showMessage('Failed to delete post. Please try again.', 'error');
      }
    }

    // Edit post (simple implementation - you can enhance this)
    function editPost(postId) {
      alert('Edit functionality coming soon! For now, you can delete and recreate posts.');
    }

    // Show admin panel
    function showAdminPanel() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('adminPanel').classList.add('active');
    }

    // Logout
    function logout() {
      localStorage.removeItem('adminToken');
      isAuthenticated = false;
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('adminPanel').classList.remove('active');
      document.getElementById('loginForm').reset();
    }

    // Show message
    function showMessage(message, type) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `${type}-message`;
      messageDiv.textContent = message;
      
      const container = document.querySelector('.admin-container');
      container.insertBefore(messageDiv, container.firstChild);
      
      setTimeout(() => {
        messageDiv.remove();
      }, 3000);
    }
  </script>
</body>
</html>
