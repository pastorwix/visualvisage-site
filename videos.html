<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Videos – Visual Visage</title>

  <!-- Fonts + CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(circle at 20% 20%, #12305c 0%, #0b1b36 45%, #050b16 80%);
      color: #e5ecff;
      margin: 0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          to right,
          rgba(120, 200, 255, 0.25) 0,
          rgba(120, 200, 255, 0.25) 1px,
          transparent 1px,
          transparent 48px
        ),
        repeating-linear-gradient(
          to bottom,
          rgba(120, 200, 255, 0.22) 0,
          rgba(120, 200, 255, 0.22) 1px,
          transparent 1px,
          transparent 38px
        );
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: rgba(6, 10, 20, 0.9);
      padding: 1rem 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
    }

    .sticky-nav nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .sticky-nav nav a {
      text-decoration: underline;
      font-weight: 600;
      color: #cfe6ff;
      transition: color 0.3s ease;
    }

    .sticky-nav nav a:hover {
      color: #fff;
    }

    header {
      background: transparent;
      padding: 2rem 1rem 1rem;
      border-bottom: none;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    header h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 1px;
      color: #f5f9ff;
      text-shadow: 0 6px 30px rgba(0, 0, 0, 0.6);
    }

    .intro {
      text-align: center;
      padding: 2rem 1rem 0;
      position: relative;
      z-index: 1;
    }

    .intro h2 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #e8f3ff;
    }

    .intro p {
      font-size: 1rem;
      color: #c7dcff;
    }

    .masonry-videos {
      column-count: 2;
      column-gap: 1rem;
      padding: 2rem 1rem;
      max-width: 1200px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    .masonry-videos iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-bottom: 1rem;
      border-radius: 12px;
      break-inside: avoid;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(120, 200, 255, 0.2);
      border: 1px solid rgba(120, 200, 255, 0.18);
      background: rgba(8, 13, 26, 0.9);
    }

    /* Lite YouTube placeholder */
    .lite-yt {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-bottom: 1rem;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(120, 200, 255, 0.2);
      background-size: cover;
      background-position: center;
      cursor: pointer;
      break-inside: avoid;
      overflow: hidden;
      border: 1px solid rgba(120, 200, 255, 0.18);
      background-color: rgba(8, 13, 26, 0.9);
    }
    .lite-yt:focus-visible {
      outline: 3px solid rgba(255, 223, 0, 0.95);
      outline-offset: 2px;
    }
    .lite-yt .play-btn {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }
    .lite-yt .play-btn::before {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-left: 18px solid white;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      margin-left: 6px;
    }

    footer {
      background-color: #fff;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
      color: #aaa;
      border-top: 1px solid #eee;
      margin-top: 3rem;
    }

    @media (max-width: 768px) {
      .masonry-videos {
        column-count: 1;
      }
    }
  </style>
</head>
<body>

  <div class="sticky-nav">
    <nav class="global-nav">
      <a class="youtube-button" href="https://www.youtube.com/@pasturwix" target="_blank" rel="noopener">
        <img src="assets/youtube%20button.PNG" alt="YouTube channel" />
      </a>
      <button class="offcanvas-toggle" type="button" aria-controls="offcanvasNav" aria-expanded="false" aria-label="Open menu">☰ Menu</button>
    </nav>
  </div>

  <div class="offcanvas-overlay" id="offcanvasOverlay"></div>
  <aside class="offcanvas-panel" id="offcanvasNav" aria-hidden="true">
    <div class="offcanvas-header">
      <strong>Menu</strong>
      <button class="offcanvas-close" type="button" aria-label="Close menu">✕</button>
    </div>
    <ul class="offcanvas-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="posters.html">Posters</a></li>
      <li><a href="designs.html">Designs</a></li>
      <li><a href="photos.html">Photos</a></li>
      <li><a href="videos.html">Videos</a></li>
      <li><a href="tools.html">Tools</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="https://www.etsy.com/shop/VisualVisage" target="_blank" rel="noopener">Shop</a></li>
    </ul>
  </aside>

  <header>
    <h1>Visual Visage</h1>
  </header>

  <main>
    <section class="intro">
      <h2>Video Gallery</h2>
      <p>Videos I've helped film/ film + edit.</p>
    </section>

    <section class="masonry-videos" id="videos-grid">
      <noscript>
        <iframe src="https://www.youtube.com/embed/i-tZn-2Ym94" title="Paradise" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/KyQeDxWpA9I" title="Noah's Dimes Part" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/yDp7CY91dMs" title="Liam's Memorial Session" allowfullscreen></iframe>
      </noscript>
    </section>
  </main>

  <footer>
    <p>© 2025 Visual Visage</p>
  </footer>
  <script src="nav.js"></script>
  <script>
    (function() {
      const grid = document.getElementById('videos-grid');
      if (!grid) return;

      const titleMap = {
        'i-tZn-2Ym94': 'Paradise',
        'KyQeDxWpA9I': "Noah\'s Dimes Part",
        'yDp7CY91dMs': "Liam\'s Memorial Session"
      };

      function makeLite(id, title) {
        const el = document.createElement('div');
        el.className = 'lite-yt';
        el.setAttribute('role', 'button');
        el.setAttribute('tabindex', '0');
        el.setAttribute('aria-label', `Play ${title || 'video'}`);
        el.style.backgroundImage = `url('https://img.youtube.com/vi/${id}/hqdefault.jpg')`;
        const play = document.createElement('div');
        play.className = 'play-btn';
        el.appendChild(play);

        const activate = () => {
          const iframe = document.createElement('iframe');
          iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
          iframe.title = title || 'YouTube Video';
          iframe.loading = 'lazy';
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
          iframe.allowFullscreen = true;
          iframe.style.width = '100%';
          iframe.style.height = '100%';
          iframe.style.border = '0';
          iframe.style.borderRadius = '12px';
          el.replaceWith(iframe);
        };

        el.addEventListener('click', activate);
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
        });
        return el;
      }

      function initWith(ids) {
        ids.forEach((id) => {
          grid.appendChild(makeLite(id, titleMap[id] || 'Video'));
        });
      }

      fetch('assets/gallery-manifest.json')
        .then(r => r.ok ? r.json() : Promise.reject(new Error('manifest fetch failed')))
        .then(json => Array.isArray(json.videos) ? json.videos : [])
        .then(ids => { if (ids.length) initWith(ids); else initWith(['i-tZn-2Ym94','KyQeDxWpA9I','yDp7CY91dMs']); })
        .catch(() => initWith(['i-tZn-2Ym94','KyQeDxWpA9I','yDp7CY91dMs']));
    })();
  </script>

</body>
</html>
