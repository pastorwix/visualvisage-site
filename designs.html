<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Designs – Visual Visage</title>

  <!-- Fonts + CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(circle at 20% 20%, #12305c 0%, #0b1b36 45%, #050b16 80%);
      color: #e5ecff;
      margin: 0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          to right,
          rgba(120, 200, 255, 0.25) 0,
          rgba(120, 200, 255, 0.25) 1px,
          transparent 1px,
          transparent 48px
        ),
        repeating-linear-gradient(
          to bottom,
          rgba(120, 200, 255, 0.22) 0,
          rgba(120, 200, 255, 0.22) 1px,
          transparent 1px,
          transparent 38px
        );
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: rgba(6, 10, 20, 0.9);
      padding: 1rem 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
    }

    .sticky-nav nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .sticky-nav nav a {
      text-decoration: underline;
      font-weight: 600;
      color: #cfe6ff;
      transition: color 0.3s ease;
    }

    .sticky-nav nav a:hover {
      color: #fff;
    }

    header {
      background: transparent;
      padding: 2rem 1rem 1rem;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    header h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 1px;
      color: #f5f9ff;
      text-shadow: 0 6px 30px rgba(0, 0, 0, 0.6);
    }

    .intro {
      text-align: center;
      padding: 2rem 1rem 0;
      position: relative;
      z-index: 1;
    }

    .intro h2 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #e8f3ff;
    }

    .intro p {
      font-size: 1rem;
      color: #c7dcff;
    }

    .masonry-posters {
      column-count: 3;
      column-gap: 1rem;
      padding: 2rem 1rem;
      max-width: 1200px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    .design-card {
      break-inside: avoid;
      background: linear-gradient(180deg, rgba(15, 27, 51, 0.9), rgba(8, 13, 26, 0.95));
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(120, 200, 255, 0.2);
      margin-bottom: 1rem;
      padding: 1rem;
      border: 1px solid rgba(120, 200, 255, 0.18);
    }

    .design-card img {
      width: 100%;
      border-radius: 12px;
      transition: transform 0.3s ease;
      background: rgba(8, 13, 26, 0.9);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .design-card img:hover {
      transform: scale(1.02);
    }

    .design-card img[loading="lazy"] {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .design-card img[loading="lazy"].loaded {
      opacity: 1;
    }

    .design-card h3 {
      margin: 0.5rem 0;
      color: #f4f7ff;
    }

    footer {
      background: rgba(4, 8, 16, 0.7);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
      color: #b8cfff;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 3rem;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 768px) {
      .masonry-posters {
        column-count: 2;
      }
    }

    @media (max-width: 480px) {
      .masonry-posters {
        column-count: 1;
      }
    }
  </style>
</head>
<body>

  <div class="sticky-nav">
    <nav class="global-nav">
      <a class="youtube-button" href="https://www.youtube.com/@pasturwix" target="_blank" rel="noopener">
        <img src="assets/youtube%20button.PNG" alt="YouTube channel" />
      </a>
      <button class="offcanvas-toggle" type="button" aria-controls="offcanvasNav" aria-expanded="false" aria-label="Open menu">☰ Menu</button>
    </nav>
  </div>

  <div class="offcanvas-overlay" id="offcanvasOverlay"></div>
  <aside class="offcanvas-panel" id="offcanvasNav" aria-hidden="true">
    <div class="offcanvas-header">
      <strong>Menu</strong>
      <button class="offcanvas-close" type="button" aria-label="Close menu">✕</button>
    </div>
    <ul class="offcanvas-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="posters.html">Posters</a></li>
      <li><a href="designs.html">Designs</a></li>
      <li><a href="photos.html">Photos</a></li>
      <li><a href="videos.html">Videos</a></li>
      <li><a href="tools.html">Tools</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </aside>

  <header>
    <h1>Visual Visage</h1>
  </header>

  <main>
    <section class="intro">
      <h2>Design Gallery</h2>
    </section>

    <section class="masonry-posters">
      <div class="design-card">
        <img src="assets/design1.jpg" alt="Design 1" loading="lazy" decoding="async">
        <h3>NGB – Infinite Nexus</h3>
        <p>NachoGummyBears Music</p>
      </div>

      <div class="design-card">
        <img src="assets/design2.jpg" alt="Design 2" loading="lazy" decoding="async">
      </div>

      <div class="design-card">
        <img src="assets/design3.jpg" alt="Design 3" loading="lazy" decoding="async">
      </div>
    </section>
  </main>

  <script>
    // Lazy loading for images
    document.addEventListener('DOMContentLoaded', function() {
      const images = document.querySelectorAll('img[loading="lazy"]');
      
      const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            img.classList.add('loaded');
            observer.unobserve(img);
          }
        });
      });

      images.forEach(img => {
        imageObserver.observe(img);
      });
    });
  </script>

  <footer>
    <p>© 2025 Visual Visage</p>
  </footer>

  <script src="nav.js"></script>
</body>
</html>
