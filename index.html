<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual Visage</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Press+Start+2P&family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .about-preview img {
      border-radius: 50%;
      width: 200px;
      height: 200px;
      object-fit: cover;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .about-preview img:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px 10px rgba(255, 223, 0, 0.6);
    }

    .top-nav {
      text-align: left;
      padding: 1rem 2rem;
    }

    .top-nav a {
      text-decoration: underline;
      margin-right: 1rem;
      font-weight: 600;
      color: #444;
    }

    .top-nav a:hover {
      color: #000;
    }

    /* Pricing Section Styles */
    .pricing-section {
      margin: 4rem 0;
      padding: 3rem 0;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .pricing-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .pricing-header h2 {
      font-family: 'Press Start 2P', cursive;
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 1rem;
    }

    .pricing-header p {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.1rem;
      color: #666;
      max-width: 600px;
      margin: 0 auto;
    }

    .pricing-cta {
      text-align: center;
      margin-top: 2rem;
    }

    .pricing-cta .cta-button {
      display: inline-block;
      background: linear-gradient(135deg, #f2c94c 0%, #f39c12 100%);
      color: #333;
      padding: 1rem 2.5rem;
      border-radius: 50px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      text-decoration: none;
      box-shadow: 0 8px 25px rgba(242, 201, 76, 0.4);
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .pricing-cta .cta-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(242, 201, 76, 0.6);
      background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
    }

    .service-highlights {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2rem;
      margin: 2rem 0;
      padding: 0 2rem;
    }

    .service-highlight {
      background: white;
      padding: 1.5rem;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease;
    }

    .service-highlight:hover {
      transform: translateY(-5px);
    }

    .service-highlight h3 {
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      color: #333;
      margin-bottom: 0.5rem;
    }

    .service-highlight p {
      font-family: 'Quicksand', sans-serif;
      color: #666;
      font-size: 0.9rem;
    }


  </style>
</head>
<body class="nintendo-mode">

  <div class="top-nav">
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="https://www.etsy.com/shop/VisualVisage" target="_blank" rel="noopener">Shop</a>
    <a href="pricing.html">Services</a>
  </div>

  <main class="start-screen container">
    <h1 class="game-logo">VISUAL VISAGE</h1>
    <p class="press-start">Offered Services</p>

    <section class="game-menu-grid">
      <a href="posters.html" class="game-tile">
        <img src="assets/posters-preview.jpg" alt="Posters" />
        <span>Posters</span>
      </a>
      <a href="photos.html" class="game-tile">
        <img src="assets/photo-preview.jpg" alt="Photography" />
        <span>Photography</span>
      </a>
      <a href="designs.html" class="game-tile">
        <img src="assets/design-preview.jpg" alt="Designs" />
        <span>Designs</span>
      </a>
      <a href="videos.html" class="game-tile">
        <img src="assets/video-preview.jpg" alt="Video" />
        <span>Video</span>
      </a>
    </section>



    <section class="about-preview">
      <a href="https://linktr.ee/pasturwix" target="_blank" rel="noopener">
        <img src="assets/about-photo.jpg" alt="Isaah Wicks" />
      </a>
      <div class="about-text">
        <p>Hey, I'm Izzy Wicks — the creative behind Visual Visage. I bring imagination to life through posters, photos, and experimental design. Click this photo to find me. Click the SHOP button for merch!

        </p>
      </div>
    </section>

  </main>

  <script>
    // Rotate the blinking tagline each animation cycle
    (function() {
      const el = document.querySelector('.press-start');
      if (!el) return;
      const phrases = [
        'Offered Services',
        "Izzy's work",
        'CHECK OUT MY WORK'
      ];
      let i = 0;
      // Ensure initial phrase matches index 0
      el.textContent = phrases[i];
      el.addEventListener('animationiteration', () => {
        i = (i + 1) % phrases.length;
        el.textContent = phrases[i];
      });
    })();
  </script>

</body>
</html>
