<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact – Visual Visage</title>

  <!-- Fonts + CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    body { font-family: 'Quicksand', sans-serif; background:var(--accent, #f2c94c); color:#2d2d2d; margin:0; }
    header { background:#fff; padding:2rem 1rem; border-bottom:1px solid #eee; text-align:center; }
    header h1 { font-family:'Fredoka', sans-serif; font-size:2.2rem; letter-spacing:1px; margin:0; }
    nav ul { list-style:none; padding:0; margin:1rem 0 0; }
    nav li { display:inline-block; margin:0 1rem; }
    nav a { text-decoration: none; color:#888; font-weight:600; transition:color .3s; }
    nav a:hover { color:#2d2d2d; }

    .lava-bg { position:relative; min-height:100vh; padding-bottom:4rem; }

    .contact-card { position:relative; z-index:1; max-width:840px; margin:3rem auto; padding:2.5rem 2rem; background:rgba(255,255,255,0.9); border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.06); backdrop-filter: blur(8px); }
    .contact-card h2 { font-family:'Fredoka', sans-serif; font-size:2rem; margin:0 0 .5rem; text-align:center; }
    .contact-card p.lead { color:#555; text-align:center; margin:.25rem 0 2rem; }

    form.contact-form { max-width:560px; margin:0 auto; display:grid; grid-template-columns:1fr; gap:1rem; }
    .field { display:flex; flex-direction:column; gap:.4rem; }
    .label { font-weight:600; color:#555; }
    input[type="text"], input[type="email"], textarea { padding:1rem; border:1px solid #e6e6e6; border-radius:12px; font:inherit; background:#fff; color:#333; }
    textarea { resize:vertical; min-height:140px; }
    .actions { display:flex; gap:.75rem; align-items:center; }
    .btn { padding:0.9rem 1.25rem; border:none; border-radius:12px; font-weight:700; cursor:pointer; transition:transform .1s ease, box-shadow .2s ease, background-color .2s ease; }
    .btn-primary { background:#ffbaba; color:#333; box-shadow:0 6px 20px rgba(255,186,186,.4); }
    .btn-primary:hover { background:#ff9e9e; transform: translateY(-1px); box-shadow:0 10px 28px rgba(255,186,186,.6); }
    .status { min-height:1.25rem; color:#666; font-size:.95rem; }
    .status[aria-live="polite"] { margin-top:.25rem; }

    footer { background:#fff; text-align:center; padding:1.5rem; font-size:.9rem; color:#aaa; border-top:1px solid #eee; }

    .thank-you { text-align:center; animation: fadeIn .4s ease; }
    .thank-you a { display:inline-block; margin-top:1.5rem; padding:.75rem 1.25rem; background:#ffbaba; color:#333; text-decoration:none; border-radius:12px; font-weight:700; }
    .thank-you a:hover { background:#ff9e9e; }
    @keyframes fadeIn { from {opacity:0; transform: translateY(6px);} to {opacity:1; transform: translateY(0);} }
  </style>
</head>
<body>
  <header>
    <h1>Visual Visage</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="posters.html">Posters</a></li>
        <li><a href="designs.html">Designs</a></li>
        <li><a href="photos.html">Photos</a></li>
        <li><a href="videos.html">Videos</a></li>
        <li><a href="tools.html">Tools</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="https://www.etsy.com/shop/VisualVisage" target="_blank" rel="noopener">Shop</a></li>
      </ul>
    </nav>
  </header>

  <div class="lava-bg">
    <main>
      <section class="contact-card" aria-labelledby="contact-heading">
        <h2 id="contact-heading">Contact</h2>
        <p class="lead">What can I help you with? Feel free to reach out for collaborations or inquiries.</p>

        <form id="contact-form" class="contact-form" novalidate>
          <div class="field">
            <label for="name" class="label">Your Name</label>
            <input id="name" name="name" type="text" placeholder="Jane Doe" required />
          </div>

          <div class="field">
            <label for="email" class="label">Your Email</label>
            <input id="email" name="email" type="email" placeholder="jane@example.com" required />
          </div>

          <div class="field">
            <label for="message" class="label">Your Message</label>
            <textarea id="message" name="message" placeholder="Write your message..." required></textarea>
          </div>

          <div class="actions">
            <button id="submitBtn" class="btn btn-primary" type="submit">Send Message</button>
            <span id="formStatus" class="status" aria-live="polite"></span>
          </div>
        </form>
      </section>
    </main>
  </div>

  <footer>
    <p>© 2025 Visual Visage</p>
  </footer>

  <script>
    // Config
    const OWNER_EMAIL = "pastorwix@gmail.com";
    const RAILWAY_ENDPOINT = "https://visualvisage-contact-form-server-production.up.railway.app/contact";

    const form = document.getElementById('contact-form');
    const statusEl = document.getElementById('formStatus');
    const submitBtn = document.getElementById('submitBtn');

    function setStatus(text) {
      statusEl.textContent = text || '';
    }

    function showThankYou() {
      const section = document.querySelector('.contact-card');
      section.innerHTML = `
        <div class="thank-you">
          <h2>Thanks for reaching out! ✨</h2>
          <p>I’ll get back to you as soon as possible.</p>
          <a href="index.html">← Back to Home</a>
        </div>
      `;
    }

    function composeMailto(name, email, message) {
      const subject = encodeURIComponent('Contact — Visual Visage');
      const body = encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\n${message}`);
      return `mailto:${OWNER_EMAIL}?subject=${subject}&body=${body}`;
    }

    async function postJSON(url, data, timeoutMs = 15000) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          signal: controller.signal
        });
        const text = await res.text();
        let json = null;
        try { json = text ? JSON.parse(text) : null; } catch (_) {}
        return { ok: res.ok, status: res.status, json, text };
      } finally {
        clearTimeout(t);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Basic validation
      const name = (document.getElementById('name').value || '').trim();
      const email = (document.getElementById('email').value || '').trim();
      const message = (document.getElementById('message').value || '').trim();

      if (!name || !email || !message) {
        setStatus('Please fill in all fields.');
        return;
      }
      if (!email.includes('@') || !email.includes('.')) {
        setStatus('Please enter a valid email.');
        return;
      }

      // Submit
      submitBtn.disabled = true;
      const original = submitBtn.textContent;
      submitBtn.textContent = 'Sending...';
      setStatus('');

      try {
        const result = await postJSON(RAILWAY_ENDPOINT, { name, email, message });

        if (!result.ok || !(result.json && result.json.success)) {
          const detail = (result.json && result.json.message) || result.text || `HTTP ${result.status}`;
          console.error('Contact submit failed:', detail);
          const useMail = confirm('There was an issue sending via the server. Send with your email app instead?');
          if (useMail) window.location.href = composeMailto(name, email, message);
          else setStatus('Please try again later.');
          return;
        }

        // Success
        form.reset();
        showThankYou();
      } catch (err) {
        console.error('Network error submitting contact form:', err);
        const useMail = confirm('Network error. Send with your email app instead?');
        if (useMail) window.location.href = composeMailto(name, email, message);
        else setStatus('Please try again later.');
      } finally {
        submitBtn.textContent = original;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
