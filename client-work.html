  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: radial-gradient(circle at 20% 20%, #dff1ff 0%, #c6e4ff 45%, #add9ff 80%);
      color: #0f273a;
      margin: 0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          to right,
          rgba(32, 76, 121, 0.12) 0,
          rgba(32, 76, 121, 0.12) 1px,
          transparent 1px,
          transparent 48px
        ),
        repeating-linear-gradient(
          to bottom,
          rgba(32, 76, 121, 0.1) 0,
          rgba(32, 76, 121, 0.1) 1px,
          transparent 1px,
          transparent 38px
        );
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }

    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: rgba(236, 246, 255, 0.92);
      padding: 1rem 2rem;
      border-bottom: 1px solid rgba(38, 87, 134, 0.12);
      backdrop-filter: blur(10px);
    }

    .sticky-nav nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .sticky-nav nav a {
      text-decoration: underline;
      font-weight: 600;
      color: #1f4264;
      transition: color 0.3s ease;
    }

    .sticky-nav nav a:hover {
      color: #0f2f4e;
    }

    .bookme-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffbaba, #ffd7a8);
      color: #0f2f4e;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(255, 186, 186, 0.35);
      border: 1px solid rgba(15, 47, 78, 0.06);
    }

    .bookme-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(255, 186, 186, 0.45);
    }

    header {
      background: transparent;
      padding: 2rem 1rem 1rem;
      border-bottom: none;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    header h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 1px;
      color: #0f2f4e;
      text-shadow: 0 6px 30px rgba(15, 47, 78, 0.18);
    }

    .intro {
      text-align: center;
      padding: 2rem 1rem 0;
      position: relative;
      z-index: 1;
    }

    .intro h2 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #123a5c;
    }

    .intro p {
      font-size: 1rem;
      color: #3d5a75;
    }

    .masonry-posters {
      column-count: 3;
      column-gap: 1rem;
      padding: 2rem 1rem;
      max-width: 1200px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    .masonry-posters img {
      width: 100%;
      margin-bottom: 1rem;
      border-radius: 12px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      break-inside: avoid;
      box-shadow: 0 10px 26px rgba(25, 72, 116, 0.2), 0 0 0 1px rgba(25, 72, 116, 0.18);
      border: 1px solid rgba(25, 72, 116, 0.2);
      background: rgba(237, 246, 255, 0.9);
    }

    .masonry-posters img:hover {
      transform: scale(1.03);
      box-shadow: 0 14px 30px rgba(25, 72, 116, 0.26), 0 0 0 2px rgba(25, 72, 116, 0.3);
    }

    footer {
      background: rgba(236, 246, 255, 0.9);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
      color: #2a4b69;
      border-top: 1px solid rgba(38, 87, 134, 0.12);
      margin-top: 3rem;
      position: relative;
      z-index: 1;
    }

    /* Lightbox Styles */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 9999;
      flex-direction: column;
      touch-action: none;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 12px;
    }

    .lightbox-close, .arrow {
      position: absolute;
      font-size: 2rem;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .lightbox-close {
      top: 20px;
      right: 30px;
    }

    .arrow.left {
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
    }

    .arrow.right {
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
    }

    @media (max-width: 768px) {
      .masonry-posters {
        column-count: 2;
      }
    }

    @media (max-width: 500px) {
      .masonry-posters {
        column-count: 1;
      }
    }
  </style>
</head>

  <aside class="offcanvas-panel" id="offcanvasNav" aria-hidden="true">

    <ul class="offcanvas-links">

      <li><a href="designs.html">Designs</a></li>

  <main>
    <section class="intro">

    </section>

    <section class="masonry-posters">
      <a href="https://music.apple.com/us/album/infinite-nexus-ep/1735139694" target="_blank" rel="noopener">
        <img src="assets/work1.jpg" alt="Client work 1" data-lightbox="false">

        <img src="assets/work2.jpg" alt="Client work 2" data-lightbox="false">

      </a>
      <img src="assets/work5.jpg" alt="Client work 5">
      <a href="https://www.instagram.com/biplioteca/?igsh=bjc0enJxemRhdnJq#" target="_blank" rel="noopener">

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <span class="arrow left" onclick="navigate(-1)">&#10094;</span>
    <img id="lightbox-img" src="" alt="Lightbox Image">
    <span class="arrow right" onclick="navigate(1)">&#10095;</span>
  </div>

  <footer>
    <p>© 2025 Visual Visage</p>
  </footer>

  <script src="nav.js"></script>
  <script>
    const thumbnails = document.querySelectorAll('.masonry-posters img:not([data-lightbox="false"])');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    let currentIndex = 0;
    const images = Array.from(thumbnails);

    thumbnails.forEach((img, index) => {
      img.addEventListener('click', () => {
        currentIndex = index;
        openLightbox(img.src);
      });
    });

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.style.display = 'flex';
    }

    function closeLightbox() {
      lightbox.style.display = 'none';
    }

    function navigate(direction) {
      currentIndex += direction;
      if (currentIndex < 0) currentIndex = images.length - 1;
      if (currentIndex >= images.length) currentIndex = 0;
      lightboxImg.src = images[currentIndex].src;
    }

    window.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    window.addEventListener('keydown', (e) => {
      if (lightbox.style.display === 'flex') {
        if (e.key === 'ArrowRight') navigate(1);
        if (e.key === 'ArrowLeft') navigate(-1);
        if (e.key === 'Escape') closeLightbox();
      }
    });

    let startX = 0;
    let endX = 0;

    lightbox.addEventListener('touchstart', (e) => {
      startX = e.changedTouches[0].screenX;
    });

    lightbox.addEventListener('touchend', (e) => {
      endX = e.changedTouches[0].screenX;
      handleSwipe();
    });

    function handleSwipe() {
      const diffX = startX - endX;
      if (Math.abs(diffX) > 50) {
        if (diffX > 0) {
          navigate(1);
        } else {
          navigate(-1);
        }
      }
    }
  </script>
