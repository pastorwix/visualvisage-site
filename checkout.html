<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout — Visual Visage</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body { font-family: 'Quicksand', sans-serif; background:#fdf6e3; color:#2d2d2d; margin:0; }
    .wrap { max-width:720px; margin:4rem auto; background:#fff; border-radius:16px; padding:2rem; box-shadow:0 10px 30px rgba(0,0,0,.08); }
    h1 { font-size:1.6rem; margin:0 0 1rem; }
    .row { display:flex; gap:1rem; align-items:center; justify-content:space-between; }
    .muted { color:#666; }
    .btn { display:inline-block; padding:.9rem 1.25rem; background:#f2c94c; border:none; border-radius:12px; cursor:pointer; font-weight:700; }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .notice { margin-top:.75rem; color:#666; font-size:.95rem; min-height:1.2rem; }
  </style>
  <script>
    // Configure these to your deployed payments server and publishable key
    const PAYMENTS_BASE = 'https://payment-server-production-12f0.up.railway.app'; // Live payments server on Railway
    const CREATE_SESSION_URL = PAYMENTS_BASE + '/create-checkout-session';
    const STRIPE_PUBLISHABLE_KEY = 'pk_live_51RkpO3CNXHfxy27xArC3QlCpJrizjbAJBnFWEmNoT9u1FdkGvn5CgZ5QTOf9Jgub5zekomZofqEOIOvNsyxkOuuD00X2fzPdZb';

    function getParams() {
      const usp = new URLSearchParams(location.search);
      return {
        name: usp.get('pkg') || 'Service Package',
        price: Number(usp.get('price') || '0'),
        rate: usp.get('rate') || 'standard'
      };
    }

    function cents(n) { return Math.round((Number(n) || 0) * 100); }

    async function createSession() {
      const { name, price } = getParams();
      const fullCents = cents(price);
      const res = await fetch(CREATE_SESSION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, amount: fullCents, currency: 'usd', metadata: { rate: getParams().rate } })
      });
      const text = await res.text();
      let json = null;
      try { json = text ? JSON.parse(text) : null; } catch {}
      if (!res.ok) {
        const detail = (json && (json.error || json.message)) || text || `HTTP ${res.status}`;
        throw new Error(`Failed to create session: ${detail}`);
      }
      return json || {};
    }

    function setNotice(msg) {
      const note = document.getElementById('notice');
      if (note) note.textContent = msg || '';
    }

    function hasValidParams() {
      const { name, price } = getParams();
      const valid = !!name && Number(price) > 0;
      return valid;
    }

    async function startCheckout() {
      const btn = document.getElementById('payBtn');
      btn.disabled = true; setNotice('Creating secure session...');
      try {
        if (!hasValidParams()) {
          throw new Error('Missing package or price. Please start from the pricing page.');
        }
        const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
        const { id, url } = await createSession();
        if (url) {
          window.location.href = url;
          return;
        }
        const { error } = await stripe.redirectToCheckout({ sessionId: id });
        if (error) throw error;
      } catch (err) {
        console.error(err);
        const msg = String(err && err.message || err || '').toLowerCase();
        if (msg.includes('stripe not configured')) {
          setNotice('Payment server not configured. Please try again later.');
        } else if (msg.includes('failed to fetch') || msg.includes('network')) {
          setNotice('Network or CORS error contacting payment server.');
        } else if (msg.includes('publishable key') && msg.includes('test')) {
          setNotice('Checkout key mismatch (test vs live). Please contact support.');
        } else if (msg.includes('missing') && msg.includes('price')) {
          setNotice('Missing package or price. Please start from the pricing page.');
        } else {
          setNotice('Error starting checkout. Please try again or contact us.');
        }
        btn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const { name, price } = getParams();
      const btn = document.getElementById('payBtn');
      const full = Number(price) || 0;
      const deposit = Math.round(full * 0.15);
      document.getElementById('pkgName').textContent = name || 'Service Package';
      document.getElementById('fullPrice').textContent = `$${full}`;
      document.getElementById('deposit').textContent = `$${deposit}`;
      if (!hasValidParams()) {
        btn.disabled = true;
        setNotice('Missing package or price. Please start from the pricing page.');
      }
      btn.addEventListener('click', startCheckout);
    });
  </script>
</head>
<body>
  <div class="wrap">
    <h1>Checkout — 15% Deposit</h1>
    <p class="muted">Complete a secure 15% deposit to reserve your booking. The deposit applies to your final total.</p>
    <div class="row"><strong>Package</strong><span id="pkgName"></span></div>
    <div class="row"><span class="muted">Full Price</span><span id="fullPrice"></span></div>
    <div class="row"><span class="muted">Deposit (15%)</span><span id="deposit"></span></div>
    <div style="margin-top:1.25rem;">
      <button class="btn" id="payBtn">Pay 15% Deposit</button>
      <div class="notice" id="notice"></div>
    </div>
    <p class="muted" style="margin-top:1rem;">Questions? <a href="contact.html">Contact me</a>.</p>
  </div>
</body>
</html>
