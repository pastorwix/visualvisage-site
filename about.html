  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--accent, #f2c94c);

      margin: 0;

    header {
      background-color: #fff;
      padding: 2rem 1rem;

    nav a:hover {

    }

    .lava-bg {
      position: relative;
      min-height: 100vh;
      padding-bottom: 4rem;
    }

    .about-section {
      position: relative;
      z-index: 1;
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      padding: 3rem 2rem;
      margin: 3rem auto;
      max-width: 800px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .about-section h2 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .about-section p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #555;
    }

    footer {
      background-color: #fff;
      text-align: center;
      padding: 1.5rem;
